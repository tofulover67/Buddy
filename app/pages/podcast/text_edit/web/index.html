<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src file: qrc:; style-src file: 'unsafe-inline'; font-src file:; img-src file: data:">
    <title>Text Edit</title>
    <link rel="stylesheet" href="../../../../web/buddy.css">
    <link rel="stylesheet" href="../../web/podcast.css">
    <link rel="stylesheet" href="text_edit.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="../../../../web/buddy.js"></script>
</head>
<body>
<main class="page te">
    <header class="page-head pod-head">
        <h1 class="page-title">Podcast</h1>
        <nav class="tabs pod-steps" role="tablist" id="podcast-tabs" aria-label="Podcast tools">
            <button type="button" role="tab" data-tab="sync" aria-selected="false"><span class="pod-n">1</span>Sync</button>
            <button type="button" role="tab" data-tab="switch" aria-selected="false"><span class="pod-n">2</span>Auto Switch</button>
            <button type="button" role="tab" data-tab="text" aria-selected="true"><span class="pod-n">3</span>Text Edit</button>
        </nav>
        <span class="spacer"></span>
        <span class="pod-where">
            <span class="pod-dot" id="te-dot" aria-hidden="true"></span>
            <span class="pod-where-text" id="te-timeline" translate="no"></span>
            <span class="pod-where-text" id="te-conn">Connecting…</span>
        </span>
        <button type="button" class="btn ghost" id="te-cancel" hidden>Stop</button>
    </header>

    <!-- The one row of controls: find, clean up, undo and redo. Everything set once and left
         alone - tracks, where the text comes from, how it reads, shortcuts - is in Options. -->
    <div class="row te-tools">
        <label class="te-search">
            <span class="te-search-icon" id="te-find-icon" aria-hidden="true"></span>
            <input class="te-find" id="te-find" type="search" placeholder="Find in transcript"
                   aria-label="Find in transcript" spellcheck="false" autocomplete="off">
            <span class="muted small te-count" id="te-count"></span>
        </label>
        <button type="button" class="btn" id="te-clean" aria-haspopup="menu"
                title="Cut every filler word, or every long pause, in one go">Clean up</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="te-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
        <button type="button" class="btn ghost" id="te-redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
        <button type="button" class="btn ghost" id="te-options-btn" aria-expanded="false" aria-controls="te-options"
                title="Tracks, where the text comes from, text size and shortcuts">Options</button>
    </div>
    <div class="te-progress" id="te-progress" aria-hidden="true"><div class="te-progress-bar" id="te-progress-bar"></div></div>

    <div class="te-notices" id="te-notices"></div>

    <div class="te-body">
        <section class="card te-doc-card">
            <div class="te-doc" id="te-doc" tabindex="0" aria-label="Transcript"></div>
            <!-- On the words selected: what can be done with them. -->
            <div class="te-selbar" id="te-selbar" role="toolbar" aria-label="Selection" hidden>
                <button type="button" class="btn accent" id="te-sel-cut" title="Cut these words from the open timeline (Delete)">Cut</button>
                <button type="button" class="btn ghost" id="te-sel-play" title="Play from here in Resolve (Space)">Play</button>
                <button type="button" class="btn ghost" id="te-sel-fix" title="Correct a word that was heard wrong (double-click)">Fix word</button>
            </div>
        </section>

        <aside class="card te-options" id="te-options" aria-label="Options" hidden>
            <div class="te-opt-head">
                <h2 class="section-title">Options</h2>
                <span class="spacer"></span>
                <button type="button" class="btn ghost" id="te-options-close">Done</button>
            </div>

            <div class="te-opt-group">
                <h3 class="te-opt-title" title="The tracks transcribed and cut. Every cut takes the same stretch out of each of them, so the mics stay in sync.">Dialogue</h3>
                <div class="row te-toggles" id="te-audio"></div>
                <h3 class="te-opt-title" title="The picture tracks cut with the dialogue – the cameras. Leave B-roll off.">Picture</h3>
                <div class="row te-toggles" id="te-video"></div>
            </div>

            <div class="te-opt-group">
                <h3 class="te-opt-title">The text</h3>
                <div class="row te-opt-row">
                    <button type="button" class="btn accent" id="te-transcribe">Transcribe</button>
                    <button type="button" class="btn" id="te-subs" hidden
                            title="Use the subtitles already on this timeline as the transcript, with nothing to transcribe">Use subtitles</button>
                    <button type="button" class="btn ghost" id="te-retranscribe" hidden
                            title="Transcribe every dialogue clip again (words you fixed by hand are lost)">Re-transcribe</button>
                </div>
                <label class="lbl">Model <select class="field" id="te-model" aria-label="Model"></select></label>
                <label class="lbl">Language <select class="field" id="te-language" aria-label="Language"></select></label>
                <label class="lbl">A pause to clean up is longer than (s)
                    <input class="field te-num" id="te-pause-over" type="number" min="0.5" max="30" step="0.1" value="1.0"
                           aria-label="Pause length in seconds"></label>
            </div>

            <div class="te-opt-group">
                <h3 class="te-opt-title">Reading</h3>
                <div class="row te-opt-row">
                    <select class="field" id="te-font" aria-label="Font">
                        <option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option>
                    </select>
                    <select class="field" id="te-size" aria-label="Text size">
                        <option value="small">Small</option><option value="medium">Medium</option>
                        <option value="large">Large</option><option value="xlarge">Extra large</option>
                    </select>
                </div>
                <div class="row te-opt-row">
                    <button type="button" class="btn ghost te-toggle" id="te-follow" aria-pressed="true"
                            title="Scroll the transcript with the playhead">Follow</button>
                    <button type="button" class="btn ghost te-toggle" id="te-inout" aria-pressed="true"
                            title="Set the timeline's In and Out to the words you select">Set In/Out</button>
                    <button type="button" class="btn ghost te-toggle" id="te-back" aria-pressed="false"
                            title="After you click or select words, bring Resolve to the front so your own keys work there">Back to Resolve</button>
                </div>
            </div>

            <div class="te-opt-group">
                <h3 class="te-opt-title">Connection</h3>
                <div class="row te-opt-row">
                    <button type="button" class="btn" id="te-shortcuts"
                            title="The Resolve shortcuts Buddy presses to make a cut and to undo it">Shortcuts…</button>
                    <button type="button" class="btn" id="te-refresh"
                            title="Reconnect to Resolve and read the open timeline again">Refresh</button>
                </div>
            </div>
        </aside>
    </div>

    <footer class="pod-foot te-foot">
        <span class="pod-note" id="te-hint">Deleting text cuts the open timeline straight away. Ctrl+Z puts it back.</span>
    </footer>
</main>
<script src="../../web/tabs.js"></script>
<script src="text_edit.js"></script>
</body>
</html>
