<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src file: qrc:; style-src file: 'unsafe-inline'; font-src file:; img-src file: data:">
    <title>Audit</title>
    <link rel="stylesheet" href="../../../web/buddy.css">
    <link rel="stylesheet" href="audit.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="../../../web/buddy.js"></script>
</head>
<body>
<main class="page">
    <header class="page-head">
        <h1 class="page-title">Audit</h1>
        <span class="timeline" id="timeline"></span>
        <div class="spacer"></div>
        <button type="button" class="btn accent" id="check"></button>
    </header>

    <section class="card summary" id="summary"></section>
    <section class="card sound" id="sound" hidden></section>
    <div class="groups" id="groups"></div>
    <section class="card passed" id="passed" hidden></section>

    <details class="card choose" id="choose">
        <summary class="section-title">Choose checks</summary>
        <div class="choose-list" id="choose-list"></div>
    </details>
</main>
<script src="audit.js"></script>
</body>
</html>
