<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src file: qrc:; style-src file: 'unsafe-inline'; font-src file:; img-src file: data:">
    <title>Pet</title>
    <link rel="stylesheet" href="../../../../web/buddy.css">
    <link rel="stylesheet" href="../sprites.css">
    <link rel="stylesheet" href="pet.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="../../../../web/buddy.js"></script>
    <script src="../sprites.js"></script>
</head>
<body>
<main class="pet-main">
    <div class="bubble" id="bubble" hidden>
        <div class="bubble-text" id="bubble-text"></div>
        <form class="bubble-ask" id="ask-form" hidden autocomplete="off">
            <input class="field" id="ask-input" type="text" maxlength="2000" placeholder="Ask Buddy…" aria-label="Ask Buddy">
            <button type="submit" class="btn accent" id="ask-go">Ask</button>
        </form>
        <div class="bubble-tail"></div>
    </div>
    <div class="pill" id="pill" hidden>
        <button type="button" id="pill-ask" title="Ask Buddy" aria-label="Ask Buddy">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14.5V17h2.5l8.6-8.6-2.5-2.5L3 14.5zm11.7-7.1 1.2-1.2a1 1 0 0 0 0-1.4l-1.2-1.2a1 1 0 0 0-1.4 0l-1.2 1.2 2.6 2.6z"/></svg>
        </button>
        <button type="button" id="pill-open" title="Open Buddy" aria-label="Open Buddy">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h11A1.5 1.5 0 0 1 17 4.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-11zm1.5 2.5v8.5h11V7h-11z"/></svg>
        </button>
    </div>
    <div class="stage" id="stage" title="Click to pat, right-click for more, drag to move">
        <div class="pet-sprite" id="sprite" data-state="idle" data-facing="1"></div>
    </div>
</main>
<script src="pet.js"></script>
</body>
</html>
