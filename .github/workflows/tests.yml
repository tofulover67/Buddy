# Runs the test suite on Windows and on macOS: on every push and pull
# request, by hand (Actions > Tests > Run workflow), and before a release -
# release.yml calls this file, and publishes nothing unless both pass.
#
# Each machine installs what its installer's users end up with for the tests
# it runs: the Windows one only the packages its tests need, the Mac one
# everything in installer/requirements.txt.
#
# Every action is pinned to a reviewed commit (the comment gives the release
# it is): update one by looking up the new tag's commit, never by pointing
# at a tag that can move.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Full PySide6, not PySide6-Essentials: the tool pages are QtWebEngine
      # views (QtWebChannel and QtWebEngine are in its Addons half).
      - name: Run the tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --progress-bar off "PySide6>=6.10,<7" "cryptography>=50.0" "pillow>=12.3" "numpy>=1.26"
          python tests/run_suite.py -v *> test-output.txt   # exits before Qt WebEngine's teardown, which can crash
          $code = $LASTEXITCODE
          Get-Content test-output.txt
          if ($code -ne 0) {
            # Name each failure where the run's page shows it: the full log
            # above is only visible to signed-in GitHub accounts.
            $lines = @(Get-Content test-output.txt)
            $found = 0
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(FAIL|ERROR): (.+)$') {
                $test = "$($Matches[1]) $($Matches[2])"
                $end = [Math]::Min($i + 60, $lines.Count - 1)
                $why = @($lines[($i + 1)..$end] | Where-Object { $_ -match '^[\w.]*(Error|Exception|Failure)\b' }) | Select-Object -First 1
                "::error title=$test::$($why -replace '%', '%25')"
                $found++
              }
            }
            if ($found -eq 0) {
              # No test failed by name: the run itself died. Show how it ended.
              $tail = ($lines | Select-Object -Last 8) -join ' | '
              "::error title=Tests stopped (exit $code)::$($tail -replace '%', '%25')"
            }
            exit $code
          }

  mac:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
          # This Mac has no screen: the overscroll-bounce tests, which play
          # trackpad gestures in real time, don't bounce here and are skipped.
          # They run on a Mac you can see (python3 -m unittest).
          BUDDY_NO_LIVE_GESTURES: "1"
        run: |
          python -m pip install --disable-pip-version-check --progress-bar off -r installer/requirements.txt
          set +e
          python tests/run_suite.py -v > test-output.txt 2>&1
          code=$?
          set -e
          cat test-output.txt
          if [ "$code" -ne 0 ]; then
            # Name each failure where the run's page shows it, with the end
            # of its traceback: the full log above is only visible to
            # signed-in GitHub accounts.
            python - "$code" <<'EOF'
          import re, sys
          lines = open("test-output.txt", encoding="utf-8", errors="replace").read().splitlines()
          esc = lambda s: s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          prop = lambda s: esc(s).replace(":", "%3A").replace(",", "%2C")
          found = 0
          for i, line in enumerate(lines):
              m = re.match(r"^(FAIL|ERROR): (.+)$", line)
              if not m:
                  continue
              found += 1
              block = []
              for later in lines[i + 2:i + 80]:
                  if later.startswith(("=" * 20, "-" * 20)):
                      break
                  block.append(later)
              print(f"::error title={prop(m.group(1) + ' ' + m.group(2))}::{esc(chr(10).join(block[-12:]))}")
          if not found:
              # No test failed by name: the run itself died. Show how it ended.
              print(f"::error title=Tests stopped (exit {sys.argv[1]})::{esc(chr(10).join(lines[-15:]))}")
          EOF
            exit "$code"
          fi
