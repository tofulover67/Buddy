<h3>Buddy is installed.</h3>
<p>Open DaVinci Resolve and choose <b>Workspace &gt; Scripts &gt; Buddy</b>.</p>
<p>If Resolve was already open, quit it (Cmd+Q) and reopen it so the menu picks Buddy up. If Buddy
was running, quit it from its menu bar icon first.</p>
